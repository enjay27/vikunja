name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  deploy-checks:
    name: static deployment checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
